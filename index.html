<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>מחשבון נגזרות</title>
<style>
:root{--bg:#f4f6fb;--card:#ffffff;--ink:#1d2433;--muted:#667085;--line:#dfe4ee;--accent:#4f46e5;--f:#2563eb;--f1:#ea580c;--f2:#16a34a;--err:#b42318}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0f1420;--card:#171e2e;--ink:#e6eaf3;--muted:#98a2b3;--line:#2a3347;--accent:#818cf8;--f:#60a5fa;--f1:#fb923c;--f2:#4ade80;--err:#fda29b}}
:root[data-theme="dark"]{--bg:#0f1420;--card:#171e2e;--ink:#e6eaf3;--muted:#98a2b3;--line:#2a3347;--accent:#818cf8;--f:#60a5fa;--f1:#fb923c;--f2:#4ade80;--err:#fda29b}
*{box-sizing:border-box}
[hidden]{display:none !important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;line-height:1.5}
.wrap{max-width:720px;margin:0 auto;padding:24px 16px 48px}
h1{font-size:1.6rem;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px}
label{display:block;font-weight:600;margin-bottom:6px}
.row{display:flex;gap:10px;flex-wrap:wrap}
input[type=text]{flex:1 1 280px;font:inherit;font-size:1.05rem;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);direction:ltr;text-align:left}
input.small{flex:0 1 200px}
input.tiny{flex:1 1 90px}
button{font:inherit;padding:10px 16px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.res{display:grid;gap:10px}
.item{border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.item small{color:var(--muted);display:block;font-weight:600}
.rad{display:inline-flex;align-items:flex-start;white-space:nowrap}
.radicand{border-top:1.5px solid currentColor;padding:0 .2em;margin-top:.1em;line-height:1.25}
.preview{margin-top:12px;font-size:1.15rem;height:110px;overflow:auto;direction:ltr;text-align:left}
.frac{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.25;margin:0 .15em}
.frac>span{padding:0 .25em}
.frac>span:first-child{border-bottom:1.5px solid currentColor}
.math{direction:ltr;unicode-bidi:isolate;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:1.05rem;word-break:break-word;text-align:left}
.v{color:var(--muted);font-size:.9rem;direction:ltr;unicode-bidi:isolate;text-align:left;margin-top:4px}
.err{color:var(--err);font-weight:600;margin:0}
.kb{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px;direction:ltr;align-items:flex-start}
.kblock{display:grid;gap:6px}
.kblock.left,.kblock.num{grid-template-columns:repeat(4,minmax(0,1fr));flex:1 1 220px}
.kblock.right{grid-template-columns:repeat(2,minmax(0,1fr));flex:0 0 140px}
.kb button{padding:10px 0;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:1rem;min-width:0}
.kb button.wide{grid-column:span 2}
#fnrow{gap:6px;margin-top:10px}
#fnrow button{min-width:52px;padding:8px 10px}
.kb button.op{color:var(--accent);font-weight:600}
@media (max-width:560px){.kblock.right{flex:1 1 100%}}

/* ---- תנועה ואנימציות ---- */
button{transition:transform .18s cubic-bezier(.2,.8,.2,1),background-color .25s ease,box-shadow .25s ease,border-color .25s ease,color .25s ease}
/* בלי הבהוב כחול בלחיצה על מגע (טלפון) */
button{-webkit-tap-highlight-color:transparent}
/* אפקט מעבר עכבר רק במכשירים עם עכבר, כדי שלא יישאר "תקוע" אחרי נגיעה במסך */
@media (hover: hover) and (pointer: fine) {
  button:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 6px 16px rgba(20,24,40,.10)}
  button.primary:hover:not(:disabled){box-shadow:0 8px 22px rgba(79,70,229,.35)}
}
button:active:not(:disabled){transform:scale(.93);box-shadow:none;transition-duration:.07s}
button:focus:not(:focus-visible){outline:none}
button:focus-visible{outline:2px solid var(--muted);outline-offset:2px}
@keyframes key-pop{0%{transform:scale(.88)}55%{transform:scale(1.07)}100%{transform:scale(1)}}
button.pop{animation:key-pop .3s cubic-bezier(.2,.8,.2,1)}
input[type=text]{transition:border-color .25s ease,box-shadow .25s ease}
input[type=text]:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px rgba(79,70,229,.18)}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
#out:not([hidden]){animation:rise .4s cubic-bezier(.2,.8,.2,1)}
#fnrow:not([hidden]){animation:rise .25s cubic-bezier(.2,.8,.2,1)}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none !important;transition:none !important}
}
</style>
</head>
<body>
<div class="wrap">
  <h1>מחשבון נגזרות</h1>
  <p class="sub">הכנס פונקציה של x וקבל את הנגזרת הראשונה והשנייה</p>

  <div class="card">
    <label for="expr">f(x) =</label>
    <div class="row">
      <input type="text" id="expr" placeholder="למשל: x^3 - 2x + sin(x)" autocomplete="off" spellcheck="false">
      <button class="primary" id="go">חשב</button>
    </div>
    <div class="preview math" id="preview"></div>
    <div class="kb" id="keypad"></div>
  <div class="kb" id="fnrow" hidden></div>
  </div>

  <p class="err card" id="err" hidden></p>

  <div class="card" id="out" hidden>
    <div class="res">
      <div class="item"><small>הפונקציה</small><div class="math" id="r0"></div></div>
      <div class="item"><small>נגזרת ראשונה</small><div class="math" id="r1"></div></div>
      <div class="item"><small>נגזרת שנייה</small><div class="math" id="r2"></div></div>
    </div>
  </div>

</div>

<script>
// ---------- Parser: טקסט -> עץ ביטוי ----------
const FUNCS = {
  sin: Math.sin, cos: Math.cos, tan: Math.tan, exp: Math.exp,
  ln: Math.log, log: Math.log10, sqrt: Math.sqrt
};
const CONSTS = { pi: { name: 'π', v: Math.PI }, e: { name: 'e', v: Math.E } };
const PARAM_NAMES = ['a', 'b', 'c'];

const num  = v => ({ t: 'num', v });
const bin  = (op, a, b) => ({ t: 'bin', op, a, b });
const neg  = a => ({ t: 'neg', a });
const call = (name, a) => ({ t: 'fn', name, a });

function normalize(s) {
  return s.replace(/\*\*/g, '^').replace(/[×·⋅]/g, '*').replace(/−/g, '-')
          .replace(/÷/g, '/').replace(/²/g, '^2').replace(/³/g, '^3')
          .replace(/π/g, 'pi').replace(/√/g, 'sqrt');
}

function tokenize(src) {
  const toks = [];
  let i = 0;
  while (i < src.length) {
    const c = src[i];
    if (/\s/.test(c)) { i++; continue; }
    const rest = src.slice(i);
    let m;
    if ((m = /^(\d+\.?\d*|\.\d+)([eE][+-]?\d+)?/.exec(rest))) {
      toks.push({ t: 'num', v: parseFloat(m[0]) }); i += m[0].length; continue;
    }
    if ((m = /^[A-Za-z]+/.exec(rest))) {
      toks.push({ t: 'id', v: m[0].toLowerCase() }); i += m[0].length; continue;
    }
    if ('+-*/^'.includes(c)) { toks.push({ t: 'op', v: c }); i++; continue; }
    if (c === '(' || c === ')') { toks.push({ t: c }); i++; continue; }
    throw new Error(`תו לא מוכר: "${c}"`);
  }
  return toks;
}

function parse(src) {
  const s = normalize(src).trim();
  if (!s) throw new Error('הכנס פונקציה');
  const toks = tokenize(s);
  let p = 0;
  const peek = () => toks[p];
  const isOp = v => peek() && peek().t === 'op' && peek().v === v;
  const startsPrimary = () => { const t = peek(); return !!t && (t.t === 'num' || t.t === 'id' || t.t === '('); };
  const tokText = t => (t.v !== undefined ? t.v : t.t);

  function expr() {
    let n = term();
    while (isOp('+') || isOp('-')) { const op = toks[p++].v; n = bin(op, n, term()); }
    return n;
  }
  function term() {
    let n = unary();
    while (true) {
      if (isOp('*') || isOp('/')) { const op = toks[p++].v; n = bin(op, n, unary()); }
      else if (startsPrimary()) { n = bin('*', n, unary()); }   // כפל משתמע: 2x, 2sin(x)
      else break;
    }
    return n;
  }
  function unary() {
    if (isOp('-')) { p++; return neg(unary()); }
    if (isOp('+')) { p++; return unary(); }
    return power();
  }
  function power() {
    const base = primary();
    if (isOp('^')) { p++; return bin('^', base, unary()); }   // מתחברת מימין לשמאל
    return base;
  }
  function closeParen() {
    if (!peek() || peek().t !== ')') throw new Error("חסר סוגר ')'");
    p++;
  }
  function primary() {
    const t = peek();
    if (!t) throw new Error('הביטוי נגמר בפתאום');
    if (t.t === 'num') { p++; return num(t.v); }
    if (t.t === '(') { p++; const n = expr(); closeParen(); return n; }
    if (t.t === 'id') {
      p++;
      if (t.v === 'x') return { t: 'var' };
      if (PARAM_NAMES.includes(t.v)) return { t: 'param', name: t.v };
      if (CONSTS[t.v]) return { t: 'const', name: CONSTS[t.v].name, v: CONSTS[t.v].v };
      if (FUNCS[t.v]) {
        if (!peek() || peek().t !== '(') throw new Error(`אחרי ${t.v} צריך סוגריים, למשל ${t.v}(x)`);
        p++;
        const a = expr();
        closeParen();
        return call(t.v, a);
      }
      throw new Error(`לא מוכר: "${t.v}" (המשתנה הוא x בלבד)`);
    }
    throw new Error(`תו לא צפוי: "${tokText(t)}"`);
  }

  const tree = expr();
  if (p < toks.length) throw new Error(`תו לא צפוי: "${tokText(toks[p])}"`);
  return tree;
}

// ---------- עזרים ----------
const isNum  = n => n.t === 'num';
const isZero = n => isNum(n) && n.v === 0;
const isOne  = n => isNum(n) && n.v === 1;
function hasVar(n) {
  switch (n.t) {
    case 'var': return true;
    case 'num': case 'const': return false;
    case 'neg': case 'fn': return hasVar(n.a);
    case 'bin': return hasVar(n.a) || hasVar(n.b);
  }
  return false;
}
function foldOp(op, a, b) {
  switch (op) {
    case '+': return a + b;
    case '-': return a - b;
    case '*': return a * b;
    case '/': return a / b;
    case '^': return Math.pow(a, b);
  }
  return NaN;
}

// ---------- איחוד איברים בסכום: 2x + 3x - 1 - 4 -> 5x - 5 ----------
function sumTerms(n, sign, out) {
  if (n.t === 'bin' && (n.op === '+' || n.op === '-')) {
    sumTerms(n.a, sign, out);
    sumTerms(n.b, n.op === '-' ? -sign : sign, out);
  } else if (n.t === 'neg') {
    sumTerms(n.a, -sign, out);
  } else {
    out.push({ sign, t: n });
  }
  return out;
}
function ratio(x) {   // מחזיר שבר [n, d] שווה ל-x (אם יש כזה בגודל סביר)
  for (let d = 1; d <= 1000; d++) {
    const n = Math.round(x * d);
    if (Math.abs(n / d - x) < 1e-9) return [n, d];
  }
  return null;
}
function isSum(n) { return n.t === 'bin' && (n.op === '+' || n.op === '-'); }
// פולינום ב-x (עם פרמטרים): מותר לפזר רק כשכל הגורמים כאלה
// ביטוי אלגברי: פולינום, שורש, חילוק וחזקות שלמות
function isAlg(n) {
  switch (n.t) {
    case 'num': case 'var': case 'const': case 'param': return true;
    case 'neg': return isAlg(n.a);
    case 'fn': return n.name === 'sqrt' && isAlg(n.a);
    case 'bin':
      if (n.op === '^') return isNum(n.b) && isAlg(n.a);
      return isAlg(n.a) && isAlg(n.b);
  }
  return false;
}
function isPoly(n) {
  switch (n.t) {
    case 'num': case 'var': case 'const': case 'param': return true;
    case 'neg': return isPoly(n.a);
    case 'bin':
      if (n.op === '^') return isNum(n.b) && Number.isInteger(n.b.v) && n.b.v >= 0 && isPoly(n.a);
      return isPoly(n.a) && isPoly(n.b);
  }
  return false;
}
// כפל שני ביטויים עם פיזור: (a+b)(c+d) -> ac+ad+bc+bd, עם איחוד
function distribute(A, B) {
  const ta = sumTerms(A, 1, []), tb = sumTerms(B, 1, []);
  let acc = null;
  for (const x of ta) for (const y of tb) {
    let pr = productSimp(bin('*', x.t, y.t));
    if (x.sign * y.sign < 0) pr = neg(pr);
    acc = acc === null ? pr : bin('+', acc, pr);
  }
  return acc === null ? num(0) : collectSum(acc);
}
function sumOf(terms) {
  let acc = null;
  for (const { sign, t } of terms) {
    acc = acc === null ? (sign < 0 ? neg(t) : t) : bin(sign < 0 ? '-' : '+', acc, t);
  }
  return acc === null ? num(0) : acc;
}
function collectSum(expr) {
  const items = [];
  for (const { sign, t } of sumTerms(expr, 1, [])) {
    if (t.t === 'bin' && (t.op === '*' || t.op === '/')) {
      for (const sub of sumTerms(productSimp(t), sign, [])) items.push(sub);
    } else items.push({ sign, t });
  }
  const groups = new Map();   // איברים בלי מכנה, לפי הגורמים
  const fracs = new Map();    // איברים עם מכנה, לפי המכנה
  const direct = [];          // שברים שלא מצטמצמים לאיברים
  const addPlain = (sign, t) => {
    const p = productCore(t);
    if (p.zero) return;
    if (p.denF.length) {
      const dKey = p.denF.map(toText).sort().join('*') + '|' + p.d;
      const f = fracs.get(dKey) || { denF: p.denF, d: p.d, terms: [] };
      f.terms.push({ sign: sign * p.sign, t: buildCore(p.numF, [], p.c, 1) });
      fracs.set(dKey, f);
      return;
    }
    const coef = sign * p.sign * p.c / p.d;
    const hasCore = p.numF.length > 0;
    const key = hasCore ? p.numF.map(toText).sort().join('*') : '';
    const g = groups.get(key) || { coef: 0, numF: p.numF, hasCore };
    g.coef += coef;
    groups.set(key, g);
  };
  for (const { sign, t } of items) addPlain(sign, t);
  for (const f of fracs.values()) {
    const dFactors = f.d !== 1 ? [num(f.d), ...f.denF] : f.denF;
    const D = dFactors.reduce((a, x) => (a ? bin('*', a, x) : x), null);
    if (!f.denF.some(isSum)) {
      // מכנה חד-איברי: מחלקים כל איבר בנפרד, וכך מבטלים איברים בחילוק
      for (const term of f.terms) {
        for (const sub of sumTerms(term.t, term.sign, [])) {
          for (const m of sumTerms(productSimp(bin('/', sub.t, D)), sub.sign, [])) {
            const q = productCore(m.t);
            if (q.zero) continue;
            if (q.denF.length) {
              const Dm = [...(q.d !== 1 ? [num(q.d)] : []), ...q.denF].reduce((a, x) => (a ? bin('*', a, x) : x), null);
              direct.push({ sign: m.sign * q.sign, num: buildCore(q.numF, [], q.c, 1), D: Dm });
            } else addPlain(m.sign, m.t);
          }
        }
      }
      continue;
    }
    const numSum = collectSum(sumOf(f.terms));
    if (numSum.t === 'num' && numSum.v === 0) continue;
    const lead = sumTerms(numSum, 1, [])[0];
    if (lead && lead.sign < 0) direct.push({ sign: -1, t: bin('/', collectSum(neg(numSum)), D) });
    else direct.push({ sign: 1, t: bin('/', numSum, D) });
  }
  // שברים עם אותו מכנה מאוחדים למונה אחד
  const byDen = new Map();
  const out = [];
  for (const it of direct) {
    if (!it.D) { out.push(it); continue; }
    const k = toText(it.D);
    const g = byDen.get(k) || { D: it.D, terms: [] };
    g.terms.push({ sign: it.sign, t: it.num });
    byDen.set(k, g);
  }
  for (const g of byDen.values()) {
    const numSum = collectSum(sumOf(g.terms));
    if (numSum.t === 'num' && numSum.v === 0) continue;
    const lead = sumTerms(numSum, 1, [])[0];
    if (lead && lead.sign < 0) out.push({ sign: -1, t: bin('/', collectSum(neg(numSum)), g.D) });
    else out.push({ sign: 1, t: bin('/', numSum, g.D) });
  }
  for (const { coef, numF, hasCore } of groups.values()) {
    if (Math.abs(coef) < 1e-12) continue;
    const mag = Math.abs(coef);
    const sg = coef < 0 ? -1 : 1;
    let body;
    if (!hasCore) body = num(mag);
    else {
      const r = ratio(mag);
      body = r ? buildCore(numF, [], r[0], r[1]) : bin('*', num(mag), buildCore(numF, [], 1, 1));
    }
    for (const sub of sumTerms(body, sg, [])) out.push(sub);
  }
  return sumOf(out);
}

// ---------- איחוד גורמים במכפלה/מנה: x·x -> x^2, x^2/x -> x ----------
function parts(n, s, m) {
  if (n.t === 'bin') {
    if (n.op === '*') { parts(n.a, s, m); parts(n.b, s, m); return; }
    if (n.op === '/') { parts(n.a, s, m); parts(n.b, s, -m); return; }
    if (n.op === '^' && isNum(n.b)) {
      const k = n.b.v * m;
      if (Number.isInteger(k)) {
        // חזקה שלמה של מכפלה/מנה/מספר/שורש/חזקה/מינוס מתפזרת על הגורמים
        const a = n.a;
        if (a.t === 'neg') { if (Math.abs(k) % 2 === 1) s.coef *= -1; parts(a.a, s, k); return; }
        if ((a.t === 'bin' && (a.op === '*' || a.op === '/' || a.op === '^')) || a.t === 'num' || (a.t === 'fn' && a.name === 'sqrt')) {
          parts(a, s, k);
          return;
        }
      }
      addBase(s, n.a, k);
      return;
    }
  }
  if (n.t === 'fn' && n.name === 'sqrt') { addBase(s, n.a, 0.5 * m); return; }
  if (n.t === 'num') {
    if (Number.isInteger(m)) {
      const val = Math.pow(n.v, Math.abs(m));
      if (m >= 0) s.coef *= val; else s.dcoef *= val;
    } else addBase(s, n, m);
    return;
  }
  if (n.t === 'neg') { s.coef *= -1; parts(n.a, s, m); return; }
  addBase(s, n, m);
}
function addBase(s, base, e) {
  const k = toText(base);
  const g = s.bases.get(k) || { base, exp: 0 };
  g.exp += e;
  s.bases.set(k, g);
}
const gcd = (a, b) => (b ? gcd(b, a % b) : a);
// בסיס בחזקה e (e>0) כרשימת גורמים: x^(3/2) -> x·sqrt(x)
function expFactors(base, e) {
  if (e === 1) return [base];
  if (Number.isInteger(e)) return [bin('^', base, num(e))];
  if (Number.isInteger(e - 0.5)) {
    const k = e - 0.5;
    const pw = k === 0 ? [] : k === 1 ? [base] : [bin('^', base, num(k))];
    return [...pw, call('sqrt', base)];
  }
  return [bin('^', base, num(e))];
}
function productCore(n) {
  const s = { coef: 1, dcoef: 1, bases: new Map() };
  parts(n, s, 1);
  if (s.coef === 0) return { zero: true };
  let c = Math.abs(s.coef), d = Math.abs(s.dcoef);
  const sign = (s.coef * s.dcoef < 0) ? -1 : 1;
  if (Number.isInteger(c) && Number.isInteger(d) && d !== 0) {
    const g = gcd(c, d) || 1;
    c /= g; d /= g;
  }
  const numF = [], denF = [];
  for (const { base, exp } of s.bases.values()) {
    if (exp === 0) continue;
    (exp > 0 ? numF : denF).push(...expFactors(base, Math.abs(exp)));
  }
  return { zero: false, sign, c, d, numF, denF, exps: s.bases };
}
function powSum(a, k) {   // (a)^k לכל k קטן, מפוזר
  let acc = a;
  for (let i = 1; i < k; i++) acc = distribute(acc, a);
  return acc;
}

// ---------- נגזרת כשבר אחד: מונה ומכנה פולינומיים מצומצמים ----------

// הוצאת גורם משותף מסכום: 2x^3 + 4x -> 2·x·(x^2 + 2)

function factorCommon(node) {

// מחזיר ביטוי מצומצם בצורת שבר יחיד, או null
function rationalize(n) {
  const r = toRat(simp(n));
  if (!r) return null;
  let N = ptrim(r.n), D = ptrim(r.d);
  if (pzero(N)) return num(0);
  const g = pgcd(N, D);
  N = pdivmod(N, g)[0];
  D = pdivmod(D, g)[0];
  // מקדמים שלמים: מכפילים בהכפלה משותפת של המכנים
  const dens = [];
  for (const c of [...N, ...D]) { const q = ratio(c); if (!q) return null; dens.push(q[1]); }
  let L = 1;
  for (const q of dens) L = L / gcd(L, q) * q;
  N = N.map(c => Math.round(c * L));
  D = D.map(c => Math.round(c * L));
  let G = 0;
  for (const c of [...N, ...D]) G = gcd(G, Math.abs(c));
  if (G > 1) { N = N.map(c => c / G); D = D.map(c => c / G); }
  N = ptrim(N); D = ptrim(D);
  if (D[D.length - 1] < 0) { N = N.map(c => -c); D = D.map(c => -c); }
  const nn = polyNode(N);
  const nn2 = factorCommon(nn);
  if (D.length === 1 && D[0] === 1) return nn2;
  return bin('/', nn2, factorCommon(polyNode(D)));
}

// ---------- פישוט ----------
function simp(n) {
  switch (n.t) {
    case 'num': case 'var': case 'const': case 'param': return n;
    case 'fn': {
      const a = simp(n.a);
      if (n.name === 'ln' && a.t === 'const' && a.name === 'e') return num(1);
      return call(n.name, a);
    }
    case 'neg': {
      const a = simp(n.a);
      if (isNum(a)) return num(-a.v);
      if (a.t === 'neg') return a.a;
      return neg(a);
    }
    case 'bin': {
      const op = n.op;
      const a = simp(n.a), b = simp(n.b);
      if (isNum(a) && isNum(b)) {
        const r = foldOp(op, a.v, b.v);
        if (Number.isFinite(r)) return num(r);
      }
      if (op === '+' || op === '-') return collectSum(bin(op, a, b));
      if (op === '*' || op === '/') return productSimp(bin(op, a, b));
      // op === '^'
      if (isZero(b)) return num(1);
      if (isOne(b)) return a;
      if (isOne(a)) return num(1);
      if (a.t === 'bin' && a.op === '^' && isNum(a.b) && isNum(b) && Number.isInteger(a.b.v) && Number.isInteger(b.v))
        return bin('^', a.a, num(a.b.v * b.v));   // (u^m)^k = u^(m·k)
      return bin('^', a, b);
    }
  }
  return n;
}

// ---------- גזירה ----------
function d(n) {
  switch (n.t) {
    case 'num': case 'const': case 'param': return num(0);
    case 'var': return num(1);
    case 'neg': return neg(d(n.a));
    case 'bin': {
      const { op, a, b } = n;
      switch (op) {
        case '+': case '-': return bin(op, d(a), d(b));
        case '*': return bin('+', bin('*', d(a), b), bin('*', a, d(b)));
        case '/': return bin('/', bin('-', bin('*', d(a), b), bin('*', a, d(b))), bin('^', b, num(2)));
        case '^':
          // חזקה קבועה: b·a^(b-1)·a'
          if (!hasVar(b)) return bin('*', bin('*', b, bin('^', a, bin('-', b, num(1)))), d(a));
          // מעריך משתנה: a^b·b'·ln(a)
          if (!hasVar(a)) return bin('*', bin('*', call('ln', a), d(b)), n);
          // כללי: a^b·(b'·ln(a) + b·a'/a)
          return bin('*', n, bin('+', bin('*', d(b), call('ln', a)), bin('/', bin('*', b, d(a)), a)));
      }
      break;
    }
    case 'fn': {
      const { name, a } = n;
      const da = d(a);
      switch (name) {
        case 'sin':  return bin('*', call('cos', a), da);
        case 'cos':  return bin('*', neg(call('sin', a)), da);
        case 'tan':  return bin('/', da, bin('^', call('cos', a), num(2)));
        case 'exp':  return bin('*', n, da);
        case 'ln':   return bin('/', da, a);
        case 'log':  return bin('/', da, bin('*', a, call('ln', num(10))));
        case 'sqrt': return bin('/', da, bin('*', num(2), n));
      }
      break;
    }
  }
  throw new Error('לא ניתן לגזור ביטוי זה');
}

// ---------- הצגה כטקסט מתמטי ----------
const PREC = n => {
  if (n.t === 'bin') return n.op === '^' ? 4 : (n.op === '+' || n.op === '-') ? 1 : 2;
  if (n.t === 'neg' || (n.t === 'num' && n.v < 0)) return 3;
  return 5;
};
const fmt = v => String(parseFloat(v.toPrecision(10)));
const LABEL = { log: 'log10' };

function toText(n, html = false) {
  const w = (c, min) => PREC(c) < min ? `(${toText(c, html)})` : toText(c, html);
  switch (n.t) {
    case 'num':   return n.v < 0 ? '−' + fmt(-n.v) : fmt(n.v);
    case 'var':   return 'x';
    case 'const': case 'param': return n.name;
    case 'neg':   return '−' + w(n.a, 2);
    case 'fn':
      if (html && n.name === 'sqrt') return `<span class="rad">√<span class="radicand">${toText(n.a, html)}</span></span>`;
      return `${LABEL[n.name] || n.name}(${toText(n.a, html)})`;
    case 'bin': {
      const { op, a, b } = n;
      if (op === '+') return `${w(a, 1)} + ${w(b, 1)}`;
      if (op === '-') return `${w(a, 1)} − ${w(b, 2)}`;
      if (op === '*') {
        // בלי נקודת כפל בין מקדם מספרי לבין משתנה, סוגריים או שורש: 2x, 2(x + 1), 2√x
        const L = w(a, 2), R = w(b, 4);
        const coef = /^[−]?(\d+(\.\d+)?|π|e)$/.test(L);
        const target = /^x(<sup>|\^|$)/.test(R) || /^\(/.test(R) || /^<span class="rad">/.test(R) || /^sqrt\(/.test(R);
        const noDot = coef && target;
        return L + (noDot ? '' : '·') + R;
      }
      if (op === '/') return html
        ? `<span class="frac"><span>${toText(a, html)}</span><span>${toText(b, html)}</span></span>`
        : `${w(a, 2)} / ${w(b, 4)}`;
      return html ? `${w(a, 5)}<sup>${w(b, 5)}</sup>` : `${w(a, 5)}^${w(b, 5)}`;
    }
  }
  return '?';
}

// ---------- חישוב ערך ----------
function ev(n, x) {
  switch (n.t) {
    case 'num': case 'const': return n.v;
    case 'var': return x;
    case 'neg': return -ev(n.a, x);
    case 'fn':  return FUNCS[n.name](ev(n.a, x));
    case 'bin': return foldOp(n.op, ev(n.a, x), ev(n.b, x));
  }
  return NaN;
}

// כל סכום שמכיל שברים -> שבר אחד: מכנה משותף (LCM של הגורמים), מונה מאוחד ומצומצם
function singleFraction(node) {
  let items = sumTerms(node, 1, []);
  if (items.length === 1) {
    // שבר שהמונה שלו סכום: מפרקים את המונה לאיברים (כל איבר מחולק במכנה)
    const p0 = productCore(items[0].t);
    const si = p0.zero ? -1 : p0.numF.findIndex(isSum);
    if (si >= 0) {
      const rest = p0.numF.filter((_, i) => i !== si);
      const restNode = buildCore(rest, [], p0.c, 1);
      const dF = [...(p0.d !== 1 ? [num(p0.d)] : []), ...p0.denF];
      const denNode = dF.length ? dF.reduce((a, x) => (a ? bin('*', a, x) : x), null) : null;
      items = sumTerms(p0.numF[si], p0.sign, []).map(({ sign, t }) => ({
        sign, t: denNode ? bin('/', bin('*', restNode, t), denNode) : bin('*', restNode, t),
      }));
    }
  }
  const infos = items.map(({ sign, t }) => ({ sign, p: productCore(t) }));
  if (infos.some(i => i.p.zero || !Number.isInteger(i.p.d))) return null;
  if (!infos.some(i => i.p.denF.length)) return null;
  const L = new Map();   // בסיס -> החזקה המקסימלית שנדרשת במכנה
  let Ld = 1;
  for (const { p } of infos) {
    for (const [k, v] of p.exps) {
      if (v.exp >= 0) continue;
      const cur = L.get(k);
      if (!cur || cur.exp < -v.exp) L.set(k, { base: v.base, exp: -v.exp });
    }
    Ld = Ld / gcd(Ld, p.d) * p.d;
  }
  const numTerms = infos.map(({ sign, p }) => {
    const numF = [];
    for (const k of new Set([...p.exps.keys(), ...L.keys()])) {
      const pe = p.exps.get(k), le = L.get(k);
      const base = pe ? pe.base : le.base;
      const e = (pe ? pe.exp : 0) + (le ? le.exp : 0);
      if (e > 1e-12) numF.push(...expFactors(base, e));
    }
    return { sign: sign * p.sign, t: buildCore(numF, [], p.c * Ld / p.d, 1) };
  });
  // רק כשמכנה תלוי ב-x: מכנה קבוע (למשל ln(10)) לא הופך את הביטוי לשבר גדול
  if (![...L.values()].some(v => hasVar(v.base))) return null;
  const dF = [...(Ld !== 1 ? [num(Ld)] : [])];
  for (const { base, exp } of L.values()) dF.push(...expFactors(base, exp));
  if (!dF.length) return null;
  const D = dF.reduce((a, x) => (a ? bin('*', a, x) : x), null);
  return bin('/', collectSum(sumOf(numTerms)), D);
}

function analyze(src) {
  const f = simp(parse(src));
  // מצמצם גורמים משותפים בין מונה למכנה (לפני פיזור), ואז מוציא גורם משותף בכל חלק
  const factorFrac = n => {
    let m = n;
    if (n.t === 'bin' && n.op === '/') {
      // מוציאים גורם מהמונה קודם, כדי שאפשר יהיה לצמצם אותו מול המכנה
      const p = productCore(bin('/', factorCommon(n.a), n.b));
      if (!p.zero) {
        const nodesN = p.numF.slice();
        if (p.c !== 1 || !nodesN.length) nodesN.unshift(num(p.c));
        const nodesD = p.denF.slice();
        if (p.d !== 1) nodesD.unshift(num(p.d));
        let N0 = nodesN.reduce((a, f) => (a ? bin('*', a, f) : f), null);
        if (p.sign < 0) N0 = neg(N0);
        m = nodesD.length ? bin('/', N0, nodesD.reduce((a, f) => (a ? bin('*', a, f) : f), null)) : N0;
      }
    }
    if (m.t === 'bin' && m.op === '/') return bin('/', factorCommon(m.a), factorCommon(m.b));
    return factorCommon(m);
  };
  // אם יש שברים: הכל כשבר אחד. אחרת: הצורה הקצרה מבין השתיים
  const rawPick = e => {
    const sf = singleFraction(simp(e));
    if (sf) return sf;
    const r = rationalize(e), s = simp(e);
    const A = r && factorFrac(r), B = factorFrac(s);
    return A && toText(A).length <= toText(B).length ? r : s;
  };
  const f1raw = rawPick(d(f));
  const f1 = factorFrac(f1raw);
  const f2 = factorFrac(rawPick(d(f1raw)));
  return { f, f1, f2 };
}

// ---------- ממשק ----------
if (typeof document !== 'undefined') {

    let body = '';
    try { body = toText(parse($('expr').value), true); } catch (e) { body = ''; }

  const KB = {

  function keyInsert(t) {
    const el = $('expr');
    const s = el.selectionStart ?? el.value.length, e = el.selectionEnd ?? s;
    if (t === 'BS') {
      let from = s === e ? Math.max(0, s - 1) : s;
      if (s === e) {
        const m = /(sin|cos|tan|exp|ln|log|sqrt)\($|pi$/.exec(el.value.slice(0, s));
        if (m) from = s - m[0].length;
      }
      el.value = el.value.slice(0, from) + el.value.slice(e);
      el.setSelectionRange(from, from);
    } else if (t === 'RUN') {
      run();
    } else if (t === 'FUNCS') {
      $('fnrow').hidden = !$('fnrow').hidden;
      return;
    } else {
      el.value = el.value.slice(0, s) + t + el.value.slice(e);
      const pos = s + t.length;
      el.setSelectionRange(pos, pos);
    }
    el.focus();
    updatePreview();
  }
  for (const [name, keys] of Object.entries(KB)) {
    const block = document.createElement('div');
    block.className = 'kblock ' + name;
    keys.forEach(([label, val, cls]) => {
      const b = document.createElement('button');
      b.textContent = label;
      const classes = [];
      if (cls === 'wide' || cls === 'enter') classes.push('wide');
      if (cls === 'enter') classes.push('primary');
      if (['+', '-', '*', '/', '^', '^2'].includes(val)) classes.push('op');
      b.className = classes.join(' ');
      b.onclick = () => keyInsert(val);
      block.appendChild(b);
    });
    $('keypad').appendChild(block);
  }
  // שורת פונקציות וקבועים, נפתחת עם הכפתור functions
  const FN_KEYS = [['sin', 'sin('], ['cos', 'cos('], ['tan', 'tan('], ['exp', 'exp('], ['ln', 'ln('], ['log', 'log('], ['e', 'e'], ['a', 'a'], ['b', 'b'], ['c', 'c']];
  const fnrow = $('fnrow');
  FN_KEYS.forEach(([label, val]) => {
    const b = document.createElement('button');
    b.textContent = label;
    b.onclick = () => keyInsert(val);
    fnrow.appendChild(b);
  });
  $('expr').setAttribute('inputmode', 'none');

  // לחיצה על כל כפתור: פעימה קצרה שמאשרת את הלחיצה
  document.addEventListener('click', e => {
    const b = e.target.closest && e.target.closest('button');
    if (!b) return;
    b.classList.remove('pop');
    void b.offsetWidth;   // הפעלה מחדש של האנימציה
    b.classList.add('pop');
    b.addEventListener('animationend', () => b.classList.remove('pop'), { once: true });
  });
  $('go').onclick = run;
  $('expr').addEventListener('keydown', e => { if (e.key === 'Enter') run(); });
  $('expr').value = 'x^3 - 2x';
  updatePreview();
  run();
}
</script>
</body>
</html>
