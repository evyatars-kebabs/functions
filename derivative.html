<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>מחשבון נגזרות</title>
<style>
:root{--bg:#f4f6fb;--card:#ffffff;--ink:#1d2433;--muted:#667085;--line:#dfe4ee;--accent:#4f46e5;--f:#2563eb;--f1:#ea580c;--f2:#16a34a;--err:#b42318}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0f1420;--card:#171e2e;--ink:#e6eaf3;--muted:#98a2b3;--line:#2a3347;--accent:#818cf8;--f:#60a5fa;--f1:#fb923c;--f2:#4ade80;--err:#fda29b}}
:root[data-theme="dark"]{--bg:#0f1420;--card:#171e2e;--ink:#e6eaf3;--muted:#98a2b3;--line:#2a3347;--accent:#818cf8;--f:#60a5fa;--f1:#fb923c;--f2:#4ade80;--err:#fda29b}
*{box-sizing:border-box}
[hidden]{display:none !important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;line-height:1.5}
.wrap{max-width:720px;margin:0 auto;padding:24px 16px 48px}
h1{font-size:1.6rem;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px}
label{display:block;font-weight:600;margin-bottom:6px}
.row{display:flex;gap:10px;flex-wrap:wrap}
input[type=text]{flex:1 1 280px;font:inherit;font-size:1.05rem;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);direction:ltr;text-align:left}
input.small{flex:0 1 200px}
button{font:inherit;padding:10px 16px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.examples{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.examples button{font-size:.9rem;padding:6px 10px;direction:ltr}
.help{color:var(--muted);font-size:.9rem;margin:12px 0 0}
.res{display:grid;gap:10px}
.item{border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.item small{color:var(--muted);display:block;font-weight:600}
.math{direction:ltr;unicode-bidi:isolate;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:1.05rem;word-break:break-word;text-align:left}
.v{color:var(--muted);font-size:.9rem;direction:ltr;unicode-bidi:isolate;text-align:left;margin-top:4px}
.err{color:var(--err);font-weight:600;margin:0}
canvas{width:100%;height:260px;display:block}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.9rem;margin-top:10px;direction:ltr}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-inline-end:6px}
</style>
</head>
<body>
<div class="wrap">
  <h1>מחשבון נגזרות</h1>
  <p class="sub">הכנס פונקציה של x וקבל את הנגזרת הראשונה והשנייה</p>

  <div class="card">
    <label for="expr">f(x) =</label>
    <div class="row">
      <input type="text" id="expr" placeholder="למשל: x^3 - 2x + sin(x)" autocomplete="off" spellcheck="false">
      <button class="primary" id="go">חשב</button>
    </div>
    <div class="row" style="margin-top:12px">
      <input type="text" id="x0" class="small" placeholder="x = (לא חובה)" autocomplete="off" spellcheck="false">
    </div>
    <div class="examples" id="examples"></div>
    <p class="help">אופרטורים: + − · / ^ · סוגריים · כפל משתמע (2x) · פונקציות: sin cos tan exp ln log (= log₁₀) sqrt · קבועים: pi e</p>
  </div>

  <p class="err card" id="err" hidden></p>

  <div class="card" id="out" hidden>
    <div class="res">
      <div class="item"><small>הפונקציה</small><div class="math" id="r0"></div></div>
      <div class="item"><small>נגזרת ראשונה</small><div class="math" id="r1"></div><div class="v" id="v1"></div></div>
      <div class="item"><small>נגזרת שנייה</small><div class="math" id="r2"></div><div class="v" id="v2"></div></div>
    </div>
  </div>

  <div class="card" id="plotCard" hidden>
    <canvas id="plot"></canvas>
    <div class="legend">
      <span><span class="dot" style="background:var(--f)"></span>f(x)</span>
      <span><span class="dot" style="background:var(--f1)"></span>f′(x)</span>
      <span><span class="dot" style="background:var(--f2)"></span>f″(x)</span>
    </div>
  </div>
</div>

<script>
// ---------- Parser: טקסט -> עץ ביטוי ----------
const FUNCS = {
  sin: Math.sin, cos: Math.cos, tan: Math.tan, exp: Math.exp,
  ln: Math.log, log: Math.log10, sqrt: Math.sqrt
};
const CONSTS = { pi: { name: 'π', v: Math.PI }, e: { name: 'e', v: Math.E } };

const num  = v => ({ t: 'num', v });
const bin  = (op, a, b) => ({ t: 'bin', op, a, b });
const neg  = a => ({ t: 'neg', a });
const call = (name, a) => ({ t: 'fn', name, a });

function normalize(s) {
  return s.replace(/\*\*/g, '^').replace(/[×·⋅]/g, '*').replace(/−/g, '-')
          .replace(/÷/g, '/').replace(/²/g, '^2').replace(/³/g, '^3')
          .replace(/π/g, 'pi').replace(/√/g, 'sqrt');
}

function tokenize(src) {
  const toks = [];
  let i = 0;
  while (i < src.length) {
    const c = src[i];
    if (/\s/.test(c)) { i++; continue; }
    const rest = src.slice(i);
    let m;
    if ((m = /^(\d+\.?\d*|\.\d+)([eE][+-]?\d+)?/.exec(rest))) {
      toks.push({ t: 'num', v: parseFloat(m[0]) }); i += m[0].length; continue;
    }
    if ((m = /^[A-Za-z]+/.exec(rest))) {
      toks.push({ t: 'id', v: m[0].toLowerCase() }); i += m[0].length; continue;
    }
    if ('+-*/^'.includes(c)) { toks.push({ t: 'op', v: c }); i++; continue; }
    if (c === '(' || c === ')') { toks.push({ t: c }); i++; continue; }
    throw new Error(`תו לא מוכר: "${c}"`);
  }
  return toks;
}

function parse(src) {
  const s = normalize(src).trim();
  if (!s) throw new Error('הכנס פונקציה');
  const toks = tokenize(s);
  let p = 0;
  const peek = () => toks[p];
  const isOp = v => peek() && peek().t === 'op' && peek().v === v;
  const startsPrimary = () => { const t = peek(); return !!t && (t.t === 'num' || t.t === 'id' || t.t === '('); };
  const tokText = t => (t.v !== undefined ? t.v : t.t);

  function expr() {
    let n = term();
    while (isOp('+') || isOp('-')) { const op = toks[p++].v; n = bin(op, n, term()); }
    return n;
  }
  function term() {
    let n = unary();
    while (true) {
      if (isOp('*') || isOp('/')) { const op = toks[p++].v; n = bin(op, n, unary()); }
      else if (startsPrimary()) { n = bin('*', n, unary()); }   // כפל משתמע: 2x, 2sin(x)
      else break;
    }
    return n;
  }
  function unary() {
    if (isOp('-')) { p++; return neg(unary()); }
    if (isOp('+')) { p++; return unary(); }
    return power();
  }
  function power() {
    const base = primary();
    if (isOp('^')) { p++; return bin('^', base, unary()); }   // מתחברת מימין לשמאל
    return base;
  }
  function closeParen() {
    if (!peek() || peek().t !== ')') throw new Error("חסר סוגר ')'");
    p++;
  }
  function primary() {
    const t = peek();
    if (!t) throw new Error('הביטוי נגמר בפתאום');
    if (t.t === 'num') { p++; return num(t.v); }
    if (t.t === '(') { p++; const n = expr(); closeParen(); return n; }
    if (t.t === 'id') {
      p++;
      if (t.v === 'x') return { t: 'var' };
      if (CONSTS[t.v]) return { t: 'const', name: CONSTS[t.v].name, v: CONSTS[t.v].v };
      if (FUNCS[t.v]) {
        if (!peek() || peek().t !== '(') throw new Error(`אחרי ${t.v} צריך סוגריים, למשל ${t.v}(x)`);
        p++;
        const a = expr();
        closeParen();
        return call(t.v, a);
      }
      throw new Error(`לא מוכר: "${t.v}" (המשתנה הוא x בלבד)`);
    }
    throw new Error(`תו לא צפוי: "${tokText(t)}"`);
  }

  const tree = expr();
  if (p < toks.length) throw new Error(`תו לא צפוי: "${tokText(toks[p])}"`);
  return tree;
}

// ---------- עזרים ----------
const isNum  = n => n.t === 'num';
const isZero = n => isNum(n) && n.v === 0;
const isOne  = n => isNum(n) && n.v === 1;
function hasVar(n) {
  switch (n.t) {
    case 'var': return true;
    case 'num': case 'const': return false;
    case 'neg': case 'fn': return hasVar(n.a);
    case 'bin': return hasVar(n.a) || hasVar(n.b);
  }
  return false;
}
function foldOp(op, a, b) {
  switch (op) {
    case '+': return a + b;
    case '-': return a - b;
    case '*': return a * b;
    case '/': return a / b;
    case '^': return Math.pow(a, b);
  }
  return NaN;
}

// ---------- פישוט ----------
function simp(n) {
  switch (n.t) {
    case 'num': case 'var': case 'const': return n;
    case 'fn': {
      const a = simp(n.a);
      if (n.name === 'ln' && a.t === 'const' && a.name === 'e') return num(1);
      return call(n.name, a);
    }
    case 'neg': {
      const a = simp(n.a);
      if (isNum(a)) return num(-a.v);
      if (a.t === 'neg') return a.a;
      return neg(a);
    }
    case 'bin': {
      const op = n.op;
      const a = simp(n.a), b = simp(n.b);
      if (isNum(a) && isNum(b)) {
        const r = foldOp(op, a.v, b.v);
        if (Number.isFinite(r)) return num(r);
      }
      switch (op) {
        case '+':
          if (isZero(a)) return b;
          if (isZero(b)) return a;
          if (b.t === 'neg') return bin('-', a, b.a);
          if (isNum(b) && b.v < 0) return bin('-', a, num(-b.v));
          if (a.t === 'neg') return bin('-', b, a.a);
          return bin('+', a, b);
        case '-':
          if (isZero(b)) return a;
          if (isZero(a)) return simp(neg(b));
          if (b.t === 'neg') return bin('+', a, b.a);
          if (isNum(b) && b.v < 0) return bin('+', a, num(-b.v));
          return bin('-', a, b);
        case '*':
          if (isZero(a) || isZero(b)) return num(0);
          if (isOne(a)) return b;
          if (isOne(b)) return a;
          if (isNum(a) && a.v === -1) return simp(neg(b));
          if (isNum(b) && b.v === -1) return simp(neg(a));
          // איחוד מקדמים: c1·(c2·X) -> (c1·c2)·X
          if (isNum(a) && b.t === 'bin' && b.op === '*' && isNum(b.a)) return simp(bin('*', num(a.v * b.a.v), b.b));
          if (isNum(b) && a.t === 'bin' && a.op === '*' && isNum(a.a)) return simp(bin('*', num(b.v * a.a.v), a.b));
          if (a.t === 'neg') return simp(neg(bin('*', a.a, b)));
          if (b.t === 'neg') return simp(neg(bin('*', a, b.a)));
          return bin('*', a, b);
        case '/':
          if (isZero(a)) return num(0);
          if (isOne(b)) return a;
          if (a.t === 'neg') return simp(neg(bin('/', a.a, b)));
          if (b.t === 'neg') return simp(neg(bin('/', a, b.a)));
          if (!isZero(b) && toText(a) === toText(b)) return num(1);
          return bin('/', a, b);
        case '^':
          if (isZero(b)) return num(1);
          if (isOne(b)) return a;
          if (isOne(a)) return num(1);
          return bin('^', a, b);
      }
    }
  }
  return n;
}

// ---------- גזירה ----------
function d(n) {
  switch (n.t) {
    case 'num': case 'const': return num(0);
    case 'var': return num(1);
    case 'neg': return neg(d(n.a));
    case 'bin': {
      const { op, a, b } = n;
      switch (op) {
        case '+': case '-': return bin(op, d(a), d(b));
        case '*': return bin('+', bin('*', d(a), b), bin('*', a, d(b)));
        case '/': return bin('/', bin('-', bin('*', d(a), b), bin('*', a, d(b))), bin('^', b, num(2)));
        case '^':
          // חזקה קבועה: b·a^(b-1)·a'
          if (!hasVar(b)) return bin('*', bin('*', b, bin('^', a, bin('-', b, num(1)))), d(a));
          // מעריך משתנה: a^b·b'·ln(a)
          if (!hasVar(a)) return bin('*', bin('*', call('ln', a), d(b)), n);
          // כללי: a^b·(b'·ln(a) + b·a'/a)
          return bin('*', n, bin('+', bin('*', d(b), call('ln', a)), bin('/', bin('*', b, d(a)), a)));
      }
      break;
    }
    case 'fn': {
      const { name, a } = n;
      const da = d(a);
      switch (name) {
        case 'sin':  return bin('*', call('cos', a), da);
        case 'cos':  return bin('*', neg(call('sin', a)), da);
        case 'tan':  return bin('/', da, bin('^', call('cos', a), num(2)));
        case 'exp':  return bin('*', n, da);
        case 'ln':   return bin('/', da, a);
        case 'log':  return bin('/', da, bin('*', a, call('ln', num(10))));
        case 'sqrt': return bin('/', da, bin('*', num(2), n));
      }
      break;
    }
  }
  throw new Error('לא ניתן לגזור ביטוי זה');
}

// ---------- הצגה כטקסט מתמטי ----------
const PREC = n => {
  if (n.t === 'bin') return n.op === '^' ? 4 : (n.op === '+' || n.op === '-') ? 1 : 2;
  if (n.t === 'neg' || (n.t === 'num' && n.v < 0)) return 3;
  return 5;
};
const fmt = v => String(parseFloat(v.toPrecision(10)));
const LABEL = { log: 'log10' };

function toText(n) {
  const w = (c, min) => PREC(c) < min ? `(${toText(c)})` : toText(c);
  switch (n.t) {
    case 'num':   return n.v < 0 ? '−' + fmt(-n.v) : fmt(n.v);
    case 'var':   return 'x';
    case 'const': return n.name;
    case 'neg':   return '−' + w(n.a, 4);
    case 'fn':    return `${LABEL[n.name] || n.name}(${toText(n.a)})`;
    case 'bin': {
      const { op, a, b } = n;
      if (op === '+') return `${w(a, 1)} + ${w(b, 1)}`;
      if (op === '-') return `${w(a, 1)} − ${w(b, 2)}`;
      if (op === '*') return `${w(a, 2)}·${w(b, 4)}`;
      if (op === '/') return `${w(a, 2)} / ${w(b, 4)}`;
      return `${w(a, 5)}^${w(b, 5)}`;
    }
  }
  return '?';
}

// ---------- חישוב ערך ----------
function ev(n, x) {
  switch (n.t) {
    case 'num': case 'const': return n.v;
    case 'var': return x;
    case 'neg': return -ev(n.a, x);
    case 'fn':  return FUNCS[n.name](ev(n.a, x));
    case 'bin': return foldOp(n.op, ev(n.a, x), ev(n.b, x));
  }
  return NaN;
}

function analyze(src) {
  const f  = simp(parse(src));
  const f1 = simp(d(f));
  const f2 = simp(d(f1));
  return { f, f1, f2 };
}

// ---------- ממשק ----------
if (typeof document !== 'undefined') {
  const $ = id => document.getElementById(id);
  const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  const showVal = v => Number.isFinite(v) ? fmt(v) : 'לא מוגדר';
  let lastPlot = null;

  function plot(curves, c, half, x0, vals) {
    const canvas = $('plot');
    const dpr = window.devicePixelRatio || 1;
    const W = canvas.clientWidth, H = canvas.clientHeight;
    if (!W || !H) return;
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    const g = canvas.getContext('2d');
    g.setTransform(dpr, 0, 0, dpr, 0, 0);

    const xmin = c - half, xmax = c + half, N = 500;
    const data = curves.map(cv => {
      const ys = [];
      for (let i = 0; i <= N; i++) {
        const x = xmin + (xmax - xmin) * i / N;
        let y;
        try { y = ev(cv.node, x); } catch (_) { y = NaN; }
        ys.push(Number.isFinite(y) ? y : null);
      }
      return { ys, color: cv.color };
    });

    const all = data.flatMap(s => s.ys).filter(v => v !== null).sort((a, b) => a - b);
    let lo = -1, hi = 1;
    if (all.length > 1) {
      lo = all[Math.floor(all.length * 0.03)];
      hi = all[Math.min(all.length - 1, Math.floor(all.length * 0.97))];
    }
    const pad = (hi - lo) * 0.1 || 1;
    lo = Math.min(lo - pad, 0);
    hi = Math.max(hi + pad, 0);

    const X = x => (x - xmin) / (xmax - xmin) * W;
    const Y = y => H - (y - lo) / (hi - lo) * H;

    g.clearRect(0, 0, W, H);
    g.strokeStyle = css('--muted');
    g.globalAlpha = 0.5;
    g.lineWidth = 1;
    g.beginPath();
    if (0 >= lo && 0 <= hi) { g.moveTo(0, Y(0)); g.lineTo(W, Y(0)); }
    if (0 >= xmin && 0 <= xmax) { g.moveTo(X(0), 0); g.lineTo(X(0), H); }
    g.stroke();
    g.globalAlpha = 1;

    g.lineWidth = 2;
    for (const s of data) {
      g.strokeStyle = s.color;
      g.beginPath();
      let pen = false, prev = null;
      for (let i = 0; i <= N; i++) {
        const y = s.ys[i];
        const x = xmin + (xmax - xmin) * i / N;
        if (y === null) { pen = false; prev = null; continue; }
        if (!pen || (prev !== null && Math.abs(y - prev) > (hi - lo) * 2)) { g.moveTo(X(x), Y(y)); pen = true; }
        else g.lineTo(X(x), Y(y));
        prev = y;
      }
      g.stroke();
    }

    if (x0 !== null && vals) {
      vals.forEach((y, k) => {
        if (!Number.isFinite(y) || y < lo || y > hi) return;
        g.fillStyle = curves[k].color;
        g.beginPath();
        g.arc(X(x0), Y(y), 4, 0, Math.PI * 2);
        g.fill();
      });
    }
    lastPlot = () => plot(curves, c, half, x0, vals);
  }

  function run() {
    const src = $('expr').value;
    const x0s = $('x0').value.trim();
    try {
      const { f, f1, f2 } = analyze(src);
      let x0 = null;
      if (x0s) {
        const n = simp(parse(x0s));
        if (hasVar(n)) throw new Error('הנקודה חייבת להיות מספר (בלי x)');
        x0 = ev(n, 0);
        if (!Number.isFinite(x0)) throw new Error('הנקודה לא תקינה');
      }

      $('r0').textContent = 'f(x) = ' + toText(f);
      $('r1').textContent = "f′(x) = " + toText(f1);
      $('r2').textContent = "f″(x) = " + toText(f2);

      const vals = x0 !== null ? [ev(f, x0), ev(f1, x0), ev(f2, x0)] : null;
      $('v1').textContent = vals ? `ב-x = ${fmt(x0)}:  f(${fmt(x0)}) = ${showVal(vals[0])}   ·   f′ = ${showVal(vals[1])}` : '';
      $('v2').textContent = vals ? `ב-x = ${fmt(x0)}:  f″ = ${showVal(vals[2])}` : '';
      $('v2').hidden = !vals;
      $('v1').hidden = !vals;

      $('err').hidden = true;
      $('out').hidden = false;
      $('plotCard').hidden = false;
      const c = x0 !== null ? x0 : 0;
      plot([
        { node: f,  color: css('--f') },
        { node: f1, color: css('--f1') },
        { node: f2, color: css('--f2') },
      ], c, 6, x0, vals);
    } catch (e) {
      $('err').textContent = 'שגיאה: ' + e.message;
      $('err').hidden = false;
      $('out').hidden = true;
      $('plotCard').hidden = true;
      lastPlot = null;
    }
  }

  const EXAMPLES = ['x^3 - 2x', 'sin(x)·x^2', 'e^(2x)', 'ln(x^2 + 1)', 'sqrt(x) / x', 'x^x', 'tan(x)'];
  const ex = $('examples');
  EXAMPLES.forEach(s => {
    const b = document.createElement('button');
    b.textContent = s;
    b.onclick = () => { $('expr').value = s; run(); };
    ex.appendChild(b);
  });

  $('go').onclick = run;
  $('expr').addEventListener('keydown', e => { if (e.key === 'Enter') run(); });
  $('x0').addEventListener('keydown', e => { if (e.key === 'Enter') run(); });
  window.addEventListener('resize', () => { if (lastPlot) lastPlot(); });
  $('expr').value = 'x^3 - 2x';
  $('x0').value = '1';
  run();
}
</script>
</body>
</html>
